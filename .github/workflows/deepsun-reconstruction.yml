name: DeepSun 2026 reproduction audit

on:
  push:
    branches:
      - main
    paths:
      - corrected_classical_ml/reconstruction_2026/**
      - docs/**
      - data/DATASET_CARD.md
      - results/**
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - .github/workflows/deepsun-reconstruction.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: corrected_classical_ml/reconstruction_2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: corrected_classical_ml/reconstruction_2026/requirements.txt
      - name: Install scientific Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile research modules and audit internal documentation links
        run: |
          python -m compileall -q experiment.py fetch_upstream.py sweep.py sweep_extensions.py check_repo_quality.py validate_results.py
          python check_repo_quality.py
          python -m pip check
      - name: Run reconstruction unit tests
        run: python -m pytest -q
      - name: Retrieve and cryptographically verify upstream 845-event dataset
        run: python fetch_upstream.py
      - name: Run full 18-configuration exploratory audit
        run: python sweep.py
      - name: Run repeated-seed and four-class chronological sensitivity analyses
        run: python sweep_extensions.py
      - name: Validate every real-data result and avoid silent missing-class claims
        run: python validate_results.py
      - name: Execute and validate research notebook top to bottom
        run: |
          python -m jupyter nbconvert --to notebook --execute overview.ipynb --output overview-executed.ipynb --output-dir local_results --ExecutePreprocessor.timeout=240
          python -c "import nbformat; n=nbformat.read('local_results/overview-executed.ipynb',as_version=4); nbformat.validate(n); cells=[c for c in n.cells if c.cell_type=='code']; assert cells and all(c.execution_count is not None for c in cells); print('Executed notebook code cells:',len(cells))"
      - name: Record dependency versions and source data integrity
        run: |
          python -m pip freeze > local_results/pip-freeze.txt
          sha256sum local_data/flaringar_original_data.csv > local_results/upstream-sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: deepsun-2026-audit-results
          path: corrected_classical_ml/reconstruction_2026/local_results/
          retention-days: 90
