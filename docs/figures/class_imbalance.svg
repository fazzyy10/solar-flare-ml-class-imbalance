<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" role="img" aria-labelledby="title desc"><title id="title">DeepSun flare events by class</title><desc id="desc">Of 845 solar flares: C 552, M 142, B 128, X 23. X is the rarest class.</desc><rect width="900" height="365" fill="white"/><text x="28" y="40" font-family="Arial" font-size="23" font-weight="bold" fill="#172b45">Severe class imbalance is the research problem</text><text x="29" y="62" font-family="Arial" font-size="14" fill="#566579">845 flare events • 472 active regions • 13 SHARP predictors</text><text x="32" y="115" font-family="Arial" font-size="16" fill="#263E56">C</text><rect x="85" y="92" width="652" height="33" rx="5" fill="#2168A7"/><text x="748" y="115" font-family="Arial" font-size="16" font-weight="bold" fill="#263E56">552</text><text x="32" y="174" font-family="Arial" font-size="16" fill="#263E56">M</text><rect x="85" y="151" width="168" height="33" rx="5" fill="#517C9C"/><text x="264" y="174" font-family="Arial" font-size="16" font-weight="bold" fill="#263E56">142</text><text x="32" y="233" font-family="Arial" font-size="16" fill="#263E56">B</text><rect x="85" y="210" width="151" height="33" rx="5" fill="#7391AA"/><text x="247" y="233" font-family="Arial" font-size="16" font-weight="bold" fill="#263E56">128</text><text x="32" y="292" font-family="Arial" font-size="16" fill="#263E56">X</text><rect x="85" y="269" width="27" height="33" rx="5" fill="#DB744F"/><text x="123" y="292" font-family="Arial" font-size="16" font-weight="bold" fill="#263E56">23</text><text x="30" y="346" font-family="Arial" font-size="12" fill="#68788a">Upstream: ccsc-tools/FlareML, pinned commit 44ffd7ad (public source, not claimed original private MSc file)</text></svg>